<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprimir PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root {
  --bg:     #0c0c0e;
  --s1:     #141416;
  --s2:     #1a1a1d;
  --s3:     #212124;
  --border: rgba(255,255,255,0.06);
  --accent: #e84c2b;
  --a2:     #ff6b47;
  --text:   #eeebe6;
  --muted:  #6b6865;
  --muted2: #9b9895;
  --ok:     #2dd4a0;
  --warn:   #f5a623;
  --r:      10px;
  --font:   'DM Sans', system-ui, sans-serif;
  --mono:   'DM Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 48px 20px 80px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(232,76,43,0.05) 0%, transparent 70%);
  pointer-events: none;
}
.wrap { position: relative; z-index: 1; width: 100%; max-width: 600px; }

/* Header */
.hdr { text-align: center; margin-bottom: 44px; }
.status-pill {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--s1); border: 0.5px solid var(--border);
  border-radius: 999px; padding: 7px 16px; margin-bottom: 28px;
  font-size: 12px; font-weight: 500; color: var(--muted2);
  letter-spacing: .03em; transition: all .3s;
}
.status-pill.online  { border-color: rgba(45,212,160,.25);  color: var(--ok); }
.status-pill.offline { border-color: rgba(232,76,43,.25);   color: var(--a2); }
.status-pill.waiting { border-color: rgba(245,166,35,.25);  color: var(--warn); }
.sdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.status-pill.online  .sdot { box-shadow: 0 0 6px var(--ok);  animation: blink 2.4s ease infinite; }
.status-pill.waiting .sdot { animation: blink .9s ease infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
h1 { font-size: 46px; font-weight: 600; letter-spacing: -.025em; line-height: 1.05; margin-bottom: 10px; }
h1 span { color: var(--accent); }
.sub { font-size: 15px; color: var(--muted2); font-weight: 300; }

/* Drop */
.drop {
  background: var(--s1); border: 1.5px dashed rgba(255,255,255,.08);
  border-radius: var(--r); padding: 44px 32px; text-align: center;
  cursor: pointer; position: relative; transition: all .2s; margin-bottom: 16px;
}
.drop:hover, .drop.over { border-color: var(--accent); background: rgba(232,76,43,.03); }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.drop-ico { font-size: 36px; opacity: .35; margin-bottom: 10px; }
.drop-t   { font-size: 15px; font-weight: 500; margin-bottom: 5px; }
.drop-st  { font-size: 13px; color: var(--muted); }
.drop-hint { margin-top: 10px; font-size: 12px; color: var(--muted); font-style: italic; }

/* Lista archivos */
.files-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.file-row {
  background: var(--s2); border: 0.5px solid var(--border);
  border-radius: var(--r); padding: 13px 16px;
  display: flex; align-items: center; gap: 12px; transition: all .2s;
}
.file-row.comprimiendo { border-color: rgba(232,76,43,.2); }
.file-row.listo        { border-color: rgba(45,212,160,.2); }
.file-row.error-row    { border-color: rgba(232,76,43,.3); }
.frow-ico  { font-size: 22px; flex-shrink: 0; }
.frow-info { flex: 1; overflow: hidden; min-width: 0; }
.frow-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.frow-prog { height: 2px; background: var(--s3); border-radius: 1px; margin-top: 7px; overflow: hidden; }
.frow-prog-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 1px; transition: width .35s ease; }
.file-row.listo .frow-prog-fill { background: var(--ok); width: 100% !important; }
.frow-pct  { font-size: 12px; font-family: var(--mono); color: var(--muted2); flex-shrink: 0; min-width: 36px; text-align: right; }
.file-row.listo .frow-pct { color: var(--ok); }
.frow-rm   { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; font-size: 16px; flex-shrink: 0; transition: color .15s; }
.frow-rm:hover { color: var(--accent); }

/* Perfiles */
.label-sec { font-size: 11px; font-weight: 600; letter-spacing: .07em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
.perfiles  { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 24px; }
.pfbtn {
  background: var(--s1); border: 0.5px solid var(--border);
  border-radius: var(--r); padding: 13px 11px; cursor: pointer;
  text-align: left; display: flex; flex-direction: column; gap: 3px;
  transition: all .2s; color: var(--text);
}
.pfbtn:hover { border-color: rgba(255,255,255,.12); }
.pfbtn.active { border-color: var(--accent); background: rgba(232,76,43,.07); }
.pf-badge { font-size: 9px; font-weight: 700; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; margin-bottom: 3px; align-self: flex-start; }
.b-red { background: rgba(232,76,43,.15); color: var(--a2); }
.b-grn { background: rgba(45,212,160,.15); color: var(--ok); }
.b-ylw { background: rgba(245,166,35,.15); color: var(--warn); }
.pf-n  { font-size: 13px; font-weight: 500; }
.pf-d  { font-size: 11px; color: var(--muted); line-height: 1.4; }

/* Botón */
.btn-main {
  width: 100%; background: var(--accent); border: none; border-radius: var(--r);
  padding: 15px; color: #fff; font-family: var(--font); font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all .2s; letter-spacing: .01em;
}
.btn-main:hover:not(:disabled) { background: var(--a2); transform: translateY(-1px); }
.btn-main:disabled { background: var(--s2); color: var(--muted); cursor: not-allowed; transform: none; }

/* Progreso global */
.prog-wrap { display: none; margin-top: 14px; }
.prog-wrap.visible { display: block; }
.prog-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted2); margin-bottom: 6px; }
.prog-label span:last-child { font-family: var(--mono); color: var(--a2); }
.prog-bar  { height: 4px; background: var(--s2); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--a2)); border-radius: 2px; transition: width .4s ease; }

/* Error */
.err-msg { display: none; margin-top: 14px; background: rgba(232,76,43,.07); border: 0.5px solid rgba(232,76,43,.25); border-radius: 8px; padding: 12px 15px; font-size: 13px; color: var(--a2); }
.err-msg.visible { display: block; }

/* Resultado */
.resultado { display: none; margin-top: 20px; background: var(--s1); border: 0.5px solid rgba(45,212,160,.18); border-radius: var(--r); padding: 22px; }
.resultado.visible { display: block; }
.res-hdr   { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; }
.res-title { font-size: 15px; font-weight: 600; }
.stats     { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 18px; }
.stat      { background: var(--s2); border-radius: 8px; padding: 11px 13px; text-align: center; }
.sv        { font-size: 19px; font-weight: 600; font-family: var(--mono); }
.sv.ok  { color: var(--ok); }
.sv.bad { color: var(--warn); }
.sl { font-size: 11px; color: var(--muted); margin-top: 3px; }
.btn-dl {
  width: 100%; display: block; text-align: center; text-decoration: none;
  background: rgba(45,212,160,.09); border: 0.5px solid rgba(45,212,160,.28);
  border-radius: var(--r); padding: 13px; color: var(--ok);
  font-family: var(--font); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .2s;
}
.btn-dl:hover { background: rgba(45,212,160,.16); }
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div class="status-pill" id="statusPill">
      <div class="sdot"></div>
      <span id="statusTxt">Conectando…</span>
    </div>
    <h1>Comprimir <span>PDF</span></h1>
    <p class="sub">Rápido · Sin límites · Privado</p>
  </div>

  <div class="drop" id="dropZone">
    <input type="file" id="fileInput" accept=".pdf,application/pdf" multiple>
    <div class="drop-ico">📄</div>
    <div class="drop-t">Arrastra tus PDFs aquí</div>
    <div class="drop-st">o haz clic para seleccionar</div>
    <div class="drop-hint">Puedes seleccionar varios archivos a la vez</div>
  </div>

  <div class="files-list" id="filesList"></div>

  <div class="label-sec">Nivel de compresión</div>
  <div class="perfiles">
    <button class="pfbtn" data-perfil="extreme">
      <span class="pf-badge b-red">MÁXIMA</span>
      <span class="pf-n">Máxima</span>
      <span class="pf-d">Menor peso posible</span>
    </button>
    <button class="pfbtn active" data-perfil="recommended">
      <span class="pf-badge b-grn">ÓPTIMA</span>
      <span class="pf-n">Óptima</span>
      <span class="pf-d">Balance ideal</span>
    </button>
    <button class="pfbtn" data-perfil="less">
      <span class="pf-badge b-ylw">CALIDAD</span>
      <span class="pf-n">Alta calidad</span>
      <span class="pf-d">Preserva detalles</span>
    </button>
  </div>

  <button class="btn-main" id="btnComprimir" disabled>Selecciona un PDF</button>

  <div class="prog-wrap" id="progWrap">
    <div class="prog-label">
      <span id="progLabel">Procesando…</span>
      <span id="progPct">0%</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
  </div>

  <div class="err-msg" id="errMsg"></div>

  <div class="resultado" id="resultado">
    <div class="res-hdr">
      <span style="font-size:20px">✅</span>
      <span class="res-title" id="resTitulo">¡Listo!</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="sv" id="stOrig">—</div><div class="sl">Original</div></div>
      <div class="stat"><div class="sv" id="stComp">—</div><div class="sl">Comprimido</div></div>
      <div class="stat"><div class="sv ok" id="stRed">—</div><div class="sl">Reducción</div></div>
    </div>
    <a id="btnDl" class="btn-dl" download>⬇ Descargar</a>
  </div>

</div>
<script>
const SERVER = "https://pdfcompress-my7p.onrender.com";

let archivos     = [];
let perfilActivo = "recommended";
let servidorListo = false;
let blobDescarga  = null;

// ── Servidor ──────────────────────────────────
async function verificarServidor(silencioso = false) {
  const MAX = 10, ESPERA = 5000;
  for (let i = 1; i <= MAX; i++) {
    if (!silencioso) setPill("waiting", i === 1 ? "Conectando…" : `Conectando… (${i}/${MAX})`);
    try {
      const r = await fetch(`${SERVER}/estado`, { signal: AbortSignal.timeout(8000) });
      const d = await r.json();
      if (d.activo) { servidorListo = true; setPill("online", "Activo"); return true; }
    } catch {}
    if (i < MAX) await sleep(ESPERA);
  }
  servidorListo = false; setPill("offline", "Sin conexión"); return false;
}
function setPill(estado, texto) {
  document.getElementById("statusPill").className = "status-pill " + estado;
  document.getElementById("statusTxt").textContent = texto;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Drop ──────────────────────────────────────
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
dropZone.addEventListener("dragover",  e => { e.preventDefault(); dropZone.classList.add("over"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
dropZone.addEventListener("drop", e => {
  e.preventDefault(); dropZone.classList.remove("over");
  agregarArchivos([...e.dataTransfer.files].filter(f => f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf")));
});
fileInput.addEventListener("change", e => { agregarArchivos([...e.target.files]); fileInput.value = ""; });

function agregarArchivos(nuevos) {
  nuevos.forEach(f => { if (!archivos.find(a => a.name === f.name && a.size === f.size)) archivos.push(f); });
  renderLista(); actualizarBoton();
}

function renderLista() {
  const lista = document.getElementById("filesList");
  lista.innerHTML = "";
  archivos.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "file-row"; row.id = `frow-${i}`;
    row.innerHTML = `
      <div class="frow-ico">📄</div>
      <div class="frow-info">
        <div class="frow-name">${f.name}</div>
        <div class="frow-meta">${formatBytes(f.size)}</div>
        <div class="frow-prog"><div class="frow-prog-fill" id="fpfill-${i}"></div></div>
      </div>
      <div class="frow-pct" id="fpct-${i}">—</div>
      <button class="frow-rm" data-i="${i}">✕</button>`;
    lista.appendChild(row);
  });
  lista.querySelectorAll(".frow-rm").forEach(btn => {
    btn.addEventListener("click", () => { archivos.splice(parseInt(btn.dataset.i), 1); renderLista(); actualizarBoton(); });
  });
}

function actualizarBoton() {
  const btn = document.getElementById("btnComprimir");
  if (archivos.length === 0) { btn.disabled = true; btn.textContent = "Selecciona un PDF"; }
  else { btn.disabled = false; btn.textContent = archivos.length === 1 ? "Comprimir" : `Comprimir ${archivos.length} archivos`; }
}

// ── Perfiles ──────────────────────────────────
document.querySelectorAll(".pfbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".pfbtn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active"); perfilActivo = btn.dataset.perfil;
  });
});

// ── Comprimir ─────────────────────────────────
document.getElementById("btnComprimir").addEventListener("click", async () => {
  if (archivos.length === 0) return;
  const btn   = document.getElementById("btnComprimir");
  const progW = document.getElementById("progWrap");
  const fill  = document.getElementById("progFill");
  const pct   = document.getElementById("progPct");
  const lbl   = document.getElementById("progLabel");
  const err   = document.getElementById("errMsg");

  btn.disabled = true;
  err.classList.remove("visible");
  document.getElementById("resultado").classList.remove("visible");
  progW.classList.add("visible");

  if (!servidorListo) {
    setProgreso(fill, pct, 0); lbl.textContent = "Despertando servidor…";
    const ok = await verificarServidor();
    if (!ok) {
      progW.classList.remove("visible");
      err.textContent = "El servidor no responde. Espera un momento e intenta de nuevo.";
      err.classList.add("visible"); btn.disabled = false; actualizarBoton(); return;
    }
  }

  const total = archivos.length;
  const resultados = [];
  let tamOrigTotal = 0, tamCompTotal = 0;

  for (let i = 0; i < total; i++) {
    const f    = archivos[i];
    const frow = document.getElementById(`frow-${i}`);
    const fpf  = document.getElementById(`fpfill-${i}`);
    const fpct = document.getElementById(`fpct-${i}`);

    frow.classList.add("comprimiendo");
    lbl.textContent = total === 1 ? "Comprimiendo…" : `Comprimiendo ${i+1} de ${total}`;

    const baseGlobal = (i / total) * 100;
    let pctLocal = 5;
    fpf.style.width = pctLocal + "%"; fpct.textContent = pctLocal + "%";

    const animId = setInterval(() => {
      pctLocal = Math.min(88, pctLocal + (88 - pctLocal) * 0.07);
      fpf.style.width = pctLocal + "%";
      fpct.textContent = Math.round(pctLocal) + "%";
      setProgreso(fill, pct, baseGlobal + (pctLocal / 100) * (100 / total));
    }, 350);

    try {
      const fd = new FormData();
      fd.append("pdf", f); fd.append("perfil", perfilActivo);
      const ctrl = new AbortController();
      const tid  = setTimeout(() => ctrl.abort(), 180000);
      const res  = await fetch(`${SERVER}/comprimir`, { method: "POST", body: fd, signal: ctrl.signal });
      clearTimeout(tid); clearInterval(animId);

      if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || `HTTP ${res.status}`); }

      const orig = parseInt(res.headers.get("X-Original-Size")   || 0);
      const comp = parseInt(res.headers.get("X-Compressed-Size") || 0);
      const blob = await res.blob();
      resultados.push({ nombre: f.name.replace(/\.pdf$/i, "_comprimido.pdf"), blob, orig, comp });
      tamOrigTotal += orig; tamCompTotal += comp;
      frow.classList.remove("comprimiendo"); frow.classList.add("listo"); fpct.textContent = "✓";

    } catch(e) {
      clearInterval(animId);
      frow.classList.remove("comprimiendo"); frow.classList.add("error-row");
      fpf.style.width = "100%"; fpf.style.background = "var(--accent)"; fpct.textContent = "✗";
      resultados.push(null);
    }
  }

  setProgreso(fill, pct, 100); lbl.textContent = "¡Completado!";
  const exitosos = resultados.filter(Boolean);

  if (exitosos.length === 0) {
    progW.classList.remove("visible");
    err.textContent = "No se pudo comprimir ningún archivo. Intenta de nuevo.";
    err.classList.add("visible"); btn.disabled = false; actualizarBoton(); return;
  }

  if (blobDescarga) URL.revokeObjectURL(blobDescarga);
  const dlBtn = document.getElementById("btnDl");

  if (exitosos.length === 1) {
    blobDescarga = URL.createObjectURL(exitosos[0].blob);
    dlBtn.href = blobDescarga; dlBtn.download = exitosos[0].nombre;
    dlBtn.textContent = `⬇ Descargar ${exitosos[0].nombre}`;
  } else {
    dlBtn.textContent = "⏳ Empaquetando ZIP…";
    const zip = new JSZip();
    exitosos.forEach(r => zip.file(r.nombre, r.blob));
    const zipBlob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
    blobDescarga = URL.createObjectURL(zipBlob);
    dlBtn.href = blobDescarga; dlBtn.download = "pdfs_comprimidos.zip";
    dlBtn.textContent = `⬇ Descargar ZIP (${exitosos.length} archivos)`;
  }

  const red = tamOrigTotal > 0 ? ((1 - tamCompTotal / tamOrigTotal) * 100).toFixed(1) : 0;
  document.getElementById("stOrig").textContent = formatBytes(tamOrigTotal);
  document.getElementById("stComp").textContent = formatBytes(tamCompTotal);
  const redEl = document.getElementById("stRed");
  redEl.textContent = (parseFloat(red) >= 0 ? "−" : "+") + Math.abs(red) + "%";
  redEl.className = "sv " + (parseFloat(red) >= 0 ? "ok" : "bad");
  document.getElementById("resTitulo").textContent = exitosos.length === total
    ? (total === 1 ? "¡Comprimido!" : `¡${total} archivos comprimidos!`)
    : `${exitosos.length} de ${total} comprimidos`;
  document.getElementById("resultado").classList.add("visible");

  setTimeout(() => { progW.classList.remove("visible"); fill.style.width = "0%"; }, 800);
  btn.disabled = false; actualizarBoton();
});

function setProgreso(fill, pct, valor) {
  const v = Math.min(100, Math.max(0, valor));
  fill.style.width = v + "%"; pct.textContent = Math.round(v) + "%";
}
function formatBytes(b) {
  if (!b) return "—";
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  return (b / 1048576).toFixed(2) + " MB";
}

verificarServidor();
setInterval(() => verificarServidor(true), 600000);
</script>
</body>
</html>
